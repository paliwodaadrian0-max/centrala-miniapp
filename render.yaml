services:
  - type: web
    name: centrala-telegram-miniapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: GROUP_CHAT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
